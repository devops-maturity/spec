# Stays '/' so a Netlify deploy preview serves its own CSS, JS and links rather
# than production's. The URLs that must be absolute (sitemap <loc>, canonical,
# hreflang, og:url) are built from params.canonicalBaseURL instead.
baseURL: /
languageCode: en-us
theme: devops-maturity
# Nothing in content/ has tags or categories and the theme has no template for
# them, so Hugo built /categories/ and /tags/ as an index.xml only: a 404 that
# the sitemap still listed.
disableKinds: ["taxonomy", "term"]
# defaultContentLanguageInSubdir: true
defaultContentLanguage: "en"

# Global parameters
params:
  # Production host for the sitemap, canonical, hreflang and og:url. Always
  # production, also on a deploy preview: a preview that named itself canonical
  # would compete with the real site in the index.
  canonicalBaseURL: 'https://devops-maturity.github.io/'

  license:
    title: License
    action:
      label: Creative Commons - CC BY 3.0
      url: 'https://creativecommons.org/licenses/by/3.0/'

  footer:
    logos:
    - name: github
      url: 'https://github.com/devops-maturity/spec'

# Languages parameters
languages:
  en:
    params:
      weight: 1
      languageName: "English"
      title: DevOps Maturity Specification
      description: Assess, improve, and showcase your DevOps maturity — across teams and organizations.
      actions:
      - label: Get started
        url: 'https://devops-maturity.github.io/devops-maturity/getting-started/quickstart/'
        primary: true
      - label: Quick Summary
        url: '#summary'
      - label: Full Specification
        url: '#specification'
      - label: Contribute
        url: 'https://github.com/devops-maturity/spec'
      # Home page "try it" snippets (layouts/partials/welcome.html)
      try:
        install_label: Assess your project from the terminal
        install: pip install devops-maturity
        install_note: Then run `dm assess`. [Quick start](https://devops-maturity.github.io/devops-maturity/getting-started/quickstart/)
        action_label: Or keep the badge current in CI
        action: |-
          - uses: devops-maturity/devops-maturity-action@v1.0.0
            with:
              github-token: ${{ secrets.GITHUB_TOKEN }}
        action_note: Runs when `devops-maturity.yml` changes. [GitHub Action](https://github.com/devops-maturity/devops-maturity-action)
        copy: Copy
        copied: Copied
      # versions:
      #   current: v1.0.0
  zh:
    params:
      weight: 2
      languageName: "中文"
      title: DevOps 成熟度规范
      description: 评估、改进和展示你的 DevOps 成熟度 — 跨团队和组织。
      actions:
      - label: 开始使用
        url: 'https://devops-maturity.github.io/devops-maturity/getting-started/quickstart/'
        primary: true
      - label: 概述
        url: '#概述'
      - label: 完整规范
        url: '#规范'
      - label: 贡献
        url: 'https://github.com/devops-maturity/spec'
      try:
        install_label: 在终端里评估你的项目
        install: pip install devops-maturity
        install_note: 然后运行 `dm assess`。[快速上手（英文）](https://devops-maturity.github.io/devops-maturity/getting-started/quickstart/)
        action_label: 或者在 CI 里自动更新徽章
        action: |-
          - uses: devops-maturity/devops-maturity-action@v1.0.0
            with:
              github-token: ${{ secrets.GITHUB_TOKEN }}
        action_note: 在 `devops-maturity.yml` 变更时运行。[GitHub Action](https://github.com/devops-maturity/devops-maturity-action)
        copy: 复制
        copied: 已复制
